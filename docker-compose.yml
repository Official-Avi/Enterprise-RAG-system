# RackFlow AI — local/staging stack for Linux hosts with Docker.
# Usage:  cp .env.example .env  (set POSTGRES_PASSWORD etc.)  &&  docker compose up --build
# Data services bind to 127.0.0.1 only. Put TLS and a real load balancer in front for staging/prod.

name: rackflow

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://rackflow:${POSTGRES_PASSWORD:-rackflow}@postgres:5432/rackflow
  VECTOR_STORE_URL: http://qdrant:6333
  VECTOR_COLLECTION: ${VECTOR_COLLECTION:-rackflow_chunks}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-extractive}
  MODEL_NAME: ${MODEL_NAME:-}
  MODEL_BASE_URL: ${MODEL_BASE_URL:-}
  MODEL_API_KEY: ${MODEL_API_KEY:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: rackflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rackflow}
      POSTGRES_DB: rackflow
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rackflow -d rackflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrantdata:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  migrate:
    build: ./backend
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    environment: *backend-env
    volumes:
      - objects:/data/objects
      - models:/data/models
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    environment: *backend-env
    command: ["rackflow-worker"]
    volumes:
      - objects:/data/objects
      - models:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    # Scale horizontally: docker compose up --scale worker=3

  web:
    build:
      context: ./apps/web
      args:
        API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  qdrantdata:
  objects:
  models:
