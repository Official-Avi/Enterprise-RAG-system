name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: rackflow
          POSTGRES_PASSWORD: rackflow
          POSTGRES_DB: rackflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rackflow" --health-interval 5s
          --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rackflow:rackflow@127.0.0.1:5432/rackflow_test
      VECTOR_STORE_URL: http://127.0.0.1:6333
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.data/models
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations
      - run: uv run mypy
      - name: Tests
        run: uv run pytest -q --durations=10

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Smoke checks
        run: |
          curl -fsS http://127.0.0.1:8000/health/live
          curl -fsS http://127.0.0.1:8000/api/v1/health/ready
          curl -fsS -o /dev/null -w "web %{http_code}\n" http://127.0.0.1:3000/login
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v
