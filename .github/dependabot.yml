# Dependency update PRs. Minor and patch updates are grouped per ecosystem to keep the PR count
# low; major updates arrive one per PR so each can be reviewed on its own. Every PR runs the full
# CI gate set (tests, e2e with the axe gates, audits, image builds).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /apps/web]
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
